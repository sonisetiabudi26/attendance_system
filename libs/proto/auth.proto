syntax = "proto3";

package auth;

enum DeviceType {
  DEVICE_TYPE_UNSPECIFIED = 0;
  WEB = 1;
  ANDROID = 2;
  IOS = 3;
  OTHER = 4;
}

service AuthService {

  rpc Login(LoginRequest)
      returns(LoginResponse);

  rpc RefreshToken(RefreshTokenRequest)
      returns(LoginResponse);

  rpc Logout(LogoutRequest)
      returns(Empty);

  rpc ChangePassword(ChangePasswordRequest)
      returns(Empty);

  rpc VerifyAccessToken(
        VerifyAccessTokenRequest
    ) returns (
        VerifyAccessTokenResponse
    );

   rpc CreateUser(CreateUserRequest)
      returns(CreateUserResponse);

   rpc UpdateCredential(UpdateCredentialRequest)
       returns(UpdateCredentialResponse);
}

message CreateUserRequest {
  string username = 1;
  string email = 2;
  string password = 3;
 
}

message CreateUserResponse {
  string userId = 1;
}

message LoginRequest {
    string email = 1;
    string password = 2;

    DeviceType deviceType = 3;
    string deviceName = 4;

    string ipAddress = 5;
    string userAgent = 6;
}

message LoginResponse {
    string accessToken = 1;
    string refreshToken = 2;
    string tokenType = 3;
    int32 expiresIn = 4;
}

message RefreshTokenRequest{
    string refreshToken = 1;
}

message LogoutRequest{
    int64 userId = 1;
}

message ChangePasswordRequest{
    int64 userId = 1;
    string oldPassword = 2;
    string newPassword = 3;
}

message VerifyAccessTokenRequest {
    string accessToken = 1;
}
message UserClaims {
    string sub = 1;
    string username = 2;
    string role = 3;
}

message MeResponse {

    string userId = 1;

    string username = 2;

    string role = 3;

    EmployeeProfile employee = 4;

}

message EmployeeProfile {

    string employeeId = 1;

    string employeeNo = 2;

    string fullName = 3;

    string phone = 4;

    string photoUrl = 5;

    string positionId = 6;

    string positionName = 7;

    repeated EmployeeLocationResponse locations = 8;

}

message EmployeeLocationResponse {

    string locationId = 1;

    string locationName = 2;

    bool isDefault = 3;

    string address = 4;

    double latitude = 5;

    double longitude = 6;

    int32 radius = 7;

}

message VerifyAccessTokenResponse {
    UserClaims user = 1;
}

message UpdateCredentialRequest {

  string userId = 1;

   string email = 2;

   string password = 3;

}

message UpdateCredentialResponse {

  string userId = 1;

}

message Empty{}